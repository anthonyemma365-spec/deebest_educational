<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Now | DeeBest Educational Institute</title>

    <meta name="description"
          content="Apply to DeeBest Educational Institute for quality examination preparation.">
<link rel="stylesheet" href="styles_1.css"></link>
  
</head>

<body><header>
    <h1>DeeBest Educational Institute</h1>
    <p>350+ Mission 2027 | Your Best Shot to Success</p>
</header>

    <main class="container">

    <img src="Images/IMG-20261025-WA0003.jpg"
          alt= "Mission 2027"
      style="width:100%;
             height:auto;"> </img>
            <h1>DeeBest Educational Institute</h1>

            <p>
                Start your journey to academic success!
                Complete the application form below to get started.
            </p>
      

        <form action="https://formsubmit.co/deebesteducational@gmail.com"
              method="POST">

            <input type="hidden" name="_subject"
                   value="New DeeBest Student Application">

            <input type="hidden" name="_captcha"
                   value="true">

            <div class="form-group">
                <label for="fullname">Full Name *</label>

                <input type="text"
                       id="fullname"
                       name="Full Name"
                       placeholder="Enter your full name"
                       autocomplete="name"
                       required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>

                <input type="tel"
                       id="phone"
                       name="Phone Number"
                       placeholder="e.g. 08012345678"
                       autocomplete="tel"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>

                <input type="email"
                       id="email"
                       name="Email Address"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-group">
                <label for="exam">Examination *</label>

                <select id="exam" name="Examination" required>
                    <option value="">Select examination</option>
                    <option value="JAMB UTME">JAMB UTME</option>
                    <option value="Post-UTME">Post-UTME</option>
                    <option value="WAEC">WAEC</option>
                    <option value="NECO">NECO</option>
                    <option value="JUPEB">JUPEB</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="learning">Preferred Learning Method *</label>

                <select id="learning" name="Learning Method" required>
                    <option value="">Choose a learning method</option>
                    <option value="Private Tutoring">Private Tutoring</option>
                    <option value="Online Classes">Online Classes</option>
                    <option value="Physical Classes">Physical Classes</option>
                    <option value="CBT Practice">CBT Practice</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Additional Information</label>

                <textarea id="message"
                          name="Additional Information"
                          placeholder="Tell us anything else we should know (optional)
                  including any other exams..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Application
            </button>

        </form>

        <a href="Index.html" class="back-link">
            ← Back to Homepage
        </a>

        <div class="footer">
            © 2027 DeeBest Educational Institute.
            All rights reserved.
        </div>

    </main>

<script src="scripts.js"></script></body>
</html>
